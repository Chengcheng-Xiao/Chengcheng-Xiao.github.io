<div id="remark42">Comments loading...</div>

<script>
  var remark_config = {
    host: "https://vps-880fb016.vps.ovh.net:8443",
    site_id: "chengcheng-xiao.github.io",
    url: window.location.origin + window.location.pathname,
    components: ["embed"],
    simple_view: true,
    no_footer: true,
    theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light"
  };
</script>

<script>
  !function(e,n){
    for(var o=0;o<(remark_config.components||["embed"]).length;o++){
      var r=n.createElement("script");
      r.type="module";
      r.async=true;
      r.defer=true;
      r.src=remark_config.host+"/web/"+remark_config.components[o]+".mjs";
      n.head.appendChild(r);
    }
  }(window,document);

  // Listen for system theme changes and update Remark42 in real-time
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
    const newTheme = event.matches ? "dark" : "light";
    if (window.REMARK42 && typeof window.REMARK42.changeTheme === 'function') {
      window.REMARK42.changeTheme(newTheme);
    }
  });
</script>
